[package]
name = "identityv-assistant"
version = "0.1.0"
description = "Identity V external visual automation assistant"
authors = ["Identity V Assistant contributors"]
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
name = "identityv_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "identityv-assistant"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "process", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
