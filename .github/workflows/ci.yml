name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"

      - name: Enable pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check frontend
        run: pnpm typecheck

      - name: Build frontend
        run: pnpm build

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: engine/pyproject.toml

      - name: Install Python dependencies
        working-directory: engine
        run: uv sync --extra windows --extra ocr --extra dev

      - name: Test Python engine
        working-directory: engine
        run: uv run pytest

      - name: Select stable Rust toolchain
        run: |
          rustup default stable-msvc
          rustup component add rustfmt

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Test Rust bridge
        run: cargo test --manifest-path src-tauri/Cargo.toml
