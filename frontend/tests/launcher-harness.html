<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>Launcher interaction test</title>
<body><div id="root"></div><script type="module">
import { mockIPC, mockWindows } from "@tauri-apps/api/mocks";
import { emit } from "@tauri-apps/api/event";
mockWindows("main");
window.isTauri = new URLSearchParams(location.search).has("desktop");
window.__launcherTest = { calls: [], newsFailure: true, selectedGamePath: "D:\\Games\\IdentityV\\dwrg.exe" };
window.__launcherTest.loadFailure = new URLSearchParams(location.search).has("loadFail");
window.__launcherTest.emitLog = (payload) => emit("engine-event", { type: "log", level: "info", data: { important: true }, ...payload });
window.__launcherTest.emitComponentProgress = (payload) => emit("component-update-progress", payload);
window.__launcherTest.emitRecognitionProgress = (payload) => emit("journal-recognition-progress", payload);
window.__launcherTest.recognitionShortcut = () => emit("journal-recognition-shortcut", { hwnd: 123 });
window.__launcherTest.updateStatus = { phase: "idle", info: null, downloaded: 0, total: null, error: null, source: "direct" };
window.__launcherTest.emitUpdate = async (patch) => {
  Object.assign(window.__launcherTest.updateStatus, patch);
  await emit("update-status", { ...window.__launcherTest.updateStatus });
};
window.__launcherTest.launcherStatus = { phase: "idle", component_path: "C:\\idv-login\\python-embed\\python.exe", message: null };
mockIPC((command, args) => {
  window.__launcherTest.calls.push({ command, args });
  if (command === "load_settings" && window.__launcherTest.loadFailure) return Promise.reject("Fixture: configuration unreadable");
  if (command === "load_settings") return { app: { launch_engine_on_start: false, check_updates_on_start: false, check_component_updates_on_launch: false }, journal: { collapsed: true } };
  if (command === "save_settings" && window.__launcherTest.saveFailure) return Promise.reject("快捷键已被占用或无法注册：Hotkey already registered: HotKey { mods: Modifiers(0x0), key: F3, id: 162 }");
  if (command === "save_settings") { window.__launcherTest.savedSettings = structuredClone(args.settings); return null; }
  if (command === "support_choose_path") return window.__launcherTest.cancelSupportPicker ? null : "C:\\fixture\\support.json";
  if (command === "preview_settings_restore") {
    window.__launcherTest.restoreSettings = structuredClone(window.__launcherTest.savedSettings);
    window.__launcherTest.restoreSettings.app.theme = "dark";
    return {id:"restore-fixture",changes:window.__launcherTest.restoreChanges ?? [{field:"settings.app.theme",before:"light",after:"dark"}],warnings:[]};
  }
  if (command === "restore_settings") { window.__launcherTest.savedSettings = structuredClone(window.__launcherTest.restoreSettings); return window.__launcherTest.restoreSettings; }
  if (["export_settings", "export_diagnostics"].includes(command) && window.__launcherTest.exportSupportFailure) return Promise.reject("无法写入所选位置 / Access denied");
  if (command === "preview_diagnostics") return {id:"bundle-fixture",truncated:false,files:[{name:"environment.json",size:200},{name:"settings.redacted.json",size:500},{name:"session.redacted.jsonl",size:1000},...(args.includeImages ? [{name:"images/failure-fixture.png",size:2048}] : [])]};
  if (command === "send_engine_command" && window.__launcherTest.failPreflight && ["start_task","start_tasks"].includes(args.command.type)) return window.__launcherTest.emitLog({type:"task_preflight",ok:false,code:"capture_failed",for_start:true,warnings:[]});
  if (command === "task_preflight") return window.__launcherTest.emitLog({type:"task_preflight",ok:true,code:"ready",for_start:false,warnings:[]}).then(() => ({requested:true,request_id:"fixture"}));
  if (command === "get_engine_snapshot" && window.__launcherTest.snapshotFailure) return Promise.reject("Fixture: status unavailable");
  if (command === "restart_engine" && window.__launcherTest.deferRestart) return new Promise(resolve => {window.__launcherTest.finishRestart=resolve;});
  if (command === "get_engine_snapshot") return { state: "stopped", status: "stopped", pid: null, last_error: null };
  if (command === "get_update_status") return { ...window.__launcherTest.updateStatus };
  if (command === "check_update") {
    const info = { version: "0.1.9", current_version: "0.1.8", notes: window.__launcherTest.releaseNotes || "# Update\n\n## Changes\n\n- **Clear** progress", date: null, sha256: "fixture", size: 10000000 };
    Object.assign(window.__launcherTest.updateStatus, { phase: "available", info, source: args.source, total: info.size });
    return info;
  }
  if (command === "download_update") {
    return window.__launcherTest.emitUpdate({ phase: "downloading", downloaded: 0 }).then(() => new Promise((resolve) => { window.__launcherTest.finishDownload = resolve; }));
  }
  if (command === "cancel_update") {
    return window.__launcherTest.emitUpdate({ phase: "cancelled" }).then(() => window.__launcherTest.finishDownload?.());
  }
  if (command === "journal_list_packs") return { directory: "fixture", packs: window.__launcherTest.packs || [], errors: [] };
  if (command === "journal_recognize") {
    window.__launcherTest.recognitionRequest = args;
    return new Promise((resolve, reject) => { window.__launcherTest.finishRecognition = resolve; window.__launcherTest.failRecognition = reject; });
  }
  if (command === "journal_cancel_recognition") return null;
  if (command === "journal_read_image") return window.__launcherTest.mapImage || "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect width="200" height="200" fill="tan"/></svg>');
  if (command === "journal_choose_pack_source") return window.__launcherTest.importSources ?? null;
  if (command === "journal_import_pack") {
    const finish = () => window.__launcherTest.importErrors?.[args.sourcePath]
      ? Promise.reject(window.__launcherTest.importErrors[args.sourcePath])
      : { directory: "fixture", packs: [], errors: [] };
    if (window.__launcherTest.deferImport) return new Promise((resolve) => { window.__launcherTest.finishImport = () => resolve(finish()); });
    return finish();
  }
  if (command === "get_launcher_status") return window.__launcherTest.launcherStatus;
  if (command === "check_login_updates") return {current_version: "v6.3.2-stable", version: "v6.3.2-stable", notes: "", release_url: null, hotfixes: window.__launcherTest.hasHotfix ? [{target_module: "fixture", target_commit: window.__launcherTest.hotfixCommit || "abcdef1234567", note: "测试热更新"}] : []};
  if (command === "apply_login_hotfixes") { window.__launcherTest.hasHotfix = false; return window.__launcherTest.deferHotfix ? new Promise(resolve => { window.__launcherTest.finishHotfix = resolve; }) : null; }
  if (command === "cancel_game_launch") { window.__launcherTest.finishLaunch?.("操作已取消"); return null; }
  if (command === "configure_login_component") {
    if (!args.download && window.__launcherTest.scanMissing) return Promise.reject("未找到官方组件，请点击“官方下载”自动下载并配置");
    window.__launcherTest.launcherStatus.component_path = args.download ? "C:\\Assistant\\components\\idv-login\\v6.3.2-stable" : "D:\\idv-login";
    return null;
  }
  if (command === "set_login_component") {
    window.__launcherTest.launcherStatus.component_path = args.executablePath;
    return null;
  }
  if (command === "launch_game") {
    Object.assign(window.__launcherTest.launcherStatus, {phase: "starting", proxy_phase: "starting", message: null});
    return new Promise((resolve, reject) => {
      window.__launcherTest.finishLaunch = (error) => {
        window.__launcherTest.launcherStatus.phase = error ? "error" : "ready";
        window.__launcherTest.launcherStatus.proxy_phase = error ? "error" : "ready";
        window.__launcherTest.launcherStatus.message = error || null;
        if (error) reject(error); else resolve();
      };
    });
  }
  if (command === "locate_game") {
    if (window.__launcherTest.locationFailure) return Promise.reject("未找到第五人格");
    if (args.executablePath?.endsWith("Fever.exe")) return Promise.reject("不能选择发烧平台");
    return args.executablePath || "C:\\Games\\IdentityV\\dwrg.exe";
  }
  if (command === "choose_game_executable") return window.__launcherTest.selectedGamePath;
  if (command === "choose_login_component") return "D:\\idv-login\\python-embed\\python.exe";
  if (command === "get_game_announcements") {
    if (window.__launcherTest.newsFailure) return Promise.reject("Network unavailable");
    return [{ title: window.__launcherTest.newsTitle || "庄园活动公告", url: "https://id5.163.com/news/official/test.html", release_time: 1793203200 }];
  }
  return null;
}, { shouldMockEvents: true });
await import("../src/main.tsx");
</script></body></html>
