[project]
name = "identityv-assistant-engine"
version = "0.1.0"
description = "External visual automation engine framework for Identity V Assistant"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "opencv-python>=4.10",
  "mss>=10.0",
  "pydantic>=2.0",
]

[project.optional-dependencies]
windows = ["dxcam>=0.0.5"]
ocr = ["rapidocr-onnxruntime>=1.4"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"
