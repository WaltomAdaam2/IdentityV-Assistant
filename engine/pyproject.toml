[project]
name = "identityv-assistant-engine"
version = "0.1.2"
description = "External visual automation engine framework for Identity V Assistant"
license = "LicenseRef-Proprietary"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "opencv-python>=4.10",
  "mss>=10.0",
    "psutil>=6.0",
  "pydantic>=2.0",
]

[project.optional-dependencies]
windows = ["dxcam>=0.0.5", "pywin32>=306", "windows-capture>=2.0.1"]
ocr = ["rapidocr-onnxruntime>=1.4"]
dev = ["pytest>=8.0"]
build = ["pyinstaller>=6.16,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "app",
  "capture",
  "config",
  "core",
  "input",
  "ipc",
  "recovery",
  "runtime",
  "states",
  "tasks",
  "vision",
  "window",
]
