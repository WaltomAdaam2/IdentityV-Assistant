[package]
name = "identityv-assistant"
version = "0.1.2"
description = "Identity V external visual automation assistant"
authors = ["Identity V Assistant contributors"]
edition = "2021"
license-file = "../LICENSE"

[lib]
name = "identityv_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "identityv-assistant"
path = "src/main.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2.14.1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "process", "sync", "time", "macros"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "9.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }

[target.'cfg(windows)'.dependencies]
windows-core = "0.62.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
